<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameVibe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #04050A;
      background-image: radial-gradient(circle at 50% 20%, rgba(99, 102, 241, 0.18) 0%, rgba(139, 92, 246, 0.08) 45%, transparent 75%);
      color: #F1F5F9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 660px; width: 100%; display: flex; flex-direction: column; gap: 16px; }
    .top-bar { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: #94A3B8; padding: 0 4px; }
    .card {
      background: rgba(10, 12, 22, 0.88);
      border: 1px solid rgba(165, 180, 252, 0.14);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 24px 80px rgba(4, 6, 20, 0.95);
    }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .track-box { display: flex; align-items: center; gap: 20px; margin: 22px 0; flex-wrap: wrap; }
    .cover { width: 96px; height: 96px; border-radius: 16px; object-fit: cover; background: #0F172A; border: 1px solid rgba(255,255,255,0.1); }
    h1 { font-size: 20px; font-weight: 700; color: #FFF; margin: 4px 0; }
    .sub { font-size: 13px; color: #94A3B8; }
    .btn {
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      color: #E2E8F0;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn:hover { background: rgba(255,255,255,0.09); }
    .btn-galactic {
      background: linear-gradient(90deg, #6366F1, #8B5CF6);
      color: #FFF;
      border: none;
      box-shadow: 0 0 24px rgba(139, 92, 246, 0.35);
    }
    .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .pack {
      padding: 12px;
      border-radius: 16px;
      background: rgba(10, 12, 22, 0.75);
      border: 1px solid rgba(255,255,255,0.06);
      color: #94A3B8;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .pack.active {
      background: rgba(99, 102, 241, 0.2);
      border-color: rgba(129, 140, 248, 0.5);
      color: #FFF;
    }
    .bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.07); border-radius: 99px; overflow: hidden; margin-top: 6px; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, #818CF8, #C084FC); width: 15%; transition: width 0.4s; }
  </style>
</head>
<body>
  <audio id="audio" crossorigin="anonymous"></audio>
  <main>
    <div class="top-bar">
      <div><strong style="color:#FFF;">GameVibe</strong> · <span id="winTitle">Ожидание игры</span></div>
      <button class="btn" id="simBtn">Тест смены сцены</button>
    </div>

    <div class="card">
      <div class="row" style="padding-bottom:16px; border-bottom:1px solid rgba(255,255,255,0.06);">
        <div>
          <div style="font-size:12px; color:#94A3B8;">Режим игры сейчас: <strong id="sceneLabel" style="color:#C4B5FD;">Спокойная сцена</strong></div>
        </div>
        <button class="btn btn-galactic" id="autoBtn">Авторежим активен</button>
      </div>

      <div class="track-box">
        <img id="cover" class="cover" src="https://i.ytimg.com/vi/sTPn4Jlrjb0/hqdefault.jpg" alt="cover" />
        <div style="flex:1; min-width:180px;">
          <div id="genreLabel" style="font-size:11px; color:#A5B4FC;">Alternative</div>
          <h1 id="trackTitle">Entombed</h1>
          <div class="sub" id="trackArtist">Deftones</div>
        </div>
        <div style="min-width:190px; background:rgba(255,255,255,0.03); padding:14px; border-radius:16px; border:1px solid rgba(255,255,255,0.06);">
          <div class="row" style="font-size:11px; color:#94A3B8;">
            <span>Активность в игре</span>
            <span id="motionVal" style="color:#A5B4FC;">14%</span>
          </div>
          <div class="bar-bg"><div class="bar-fill" id="motionBar"></div></div>
        </div>
      </div>

      <div class="row" style="padding-top:16px; border-top:1px solid rgba(255,255,255,0.06);">
        <div class="row">
          <button class="btn btn-galactic" id="playBtn">Запустить звук</button>
          <button class="btn" id="nextBtn">Следующий</button>
        </div>
      </div>
    </div>

    <div class="grid4" id="packsGrid"></div>
  </main>

  <script>
    const PACKS = {
      mix: {
        label: 'Все лучшее',
        seeds: {
          EXPLORE: ['Deftones - Entombed', 'Kavinsky - Nightcall', 'Скриптонит - Положение', 'Кино - Спокойная ночь'],
          STEALTH: ['BONES - HDMI', 'Crystal Castles - Kerosene', 'DVRST - Close Eyes'],
          COMBAT: ['Travis Scott - FE!N', 'The Prodigy - Omen', 'Denzel Curry - ULTIMATE', 'Pendulum - Propane Nightmares'],
          BOSSFIGHT: ['Deftones - My Own Summer', 'Linkin Park - Faint', 'Rammstein - Sonne', 'Slipknot - Duality']
        }
      },
      rap: {
        label: 'Рэп и Фонк',
        seeds: {
          EXPLORE: ['Скриптонит - Положение', 'A$AP Rocky - Sundress', 'Miyagi - Silhouette'],
          STEALTH: ['BONES - HDMI', '$uicideboy$ - Paris', 'DVRST - Close Eyes'],
          COMBAT: ['Travis Scott - FE!N', 'Playboi Carti - Sky', 'Big Baby Tape kizaru - 99 Problems'],
          BOSSFIGHT: ['Playboi Carti - Stop Breathing', 'Denzel Curry - ULTIMATE', 'Ghostemane - Mercury']
        }
      },
      rock: {
        label: 'Рок и Метал',
        seeds: {
          EXPLORE: ['Deftones - Sextape', 'Кино - Спокойная ночь', 'Arctic Monkeys - 505'],
          STEALTH: ['Deftones - Change', 'Rammstein - Mein Herz Brennt', 'Король и Шут - Кукла колдуна'],
          COMBAT: ['Linkin Park - Faint', 'Nirvana - Smells Like Teen Spirit', 'Кино - Группа крови'],
          BOSSFIGHT: ['Deftones - My Own Summer', 'Rammstein - Sonne', 'Slipknot - Duality', 'System Of A Down - Chop Suey']
        }
      },
      electro: {
        label: 'Электроника',
        seeds: {
          EXPLORE: ['Kavinsky - Nightcall', 'M83 - Midnight City', 'Daft Punk - Veridis Quo'],
          STEALTH: ['Crystal Castles - Kerosene', 'Gesaffelstein - Aleph', 'Massive Attack - Angel'],
          COMBAT: ['The Prodigy - Omen', 'Pendulum - Propane Nightmares', 'Gesaffelstein - Pursuit'],
          BOSSFIGHT: ['The Prodigy - Breathe', 'Carpenter Brut - Turbo Killer', 'Pendulum - Watercolour']
        }
      }
    };

    const SCENE_NAMES = {
      EXPLORE: 'Спокойная сцена',
      STEALTH: 'Напряжение / Ночь',
      COMBAT: 'Экшен / Бой',
      BOSSFIGHT: 'Пик боя / Боссфайт'
    };

    let currentPack = 'mix';
    let currentVibe = 'EXPLORE';
    let autoEnabled = true;
    let isPlaying = false;
    let seedIdx = 0;
    const audio = document.getElementById('audio');

    function renderPacks() {
      const grid = document.getElementById('packsGrid');
      grid.innerHTML = '';
      Object.entries(PACKS).forEach(([id, p]) => {
        const btn = document.createElement('button');
        btn.className = 'pack ' + (id === currentPack ? 'active' : '');
        btn.textContent = p.label;
        btn.onclick = () => { currentPack = id; renderPacks(); loadTrackForVibe(currentVibe); };
        grid.appendChild(btn);
      });
    }

    async function loadTrackForVibe(vibe) {
      currentVibe = vibe;
      document.getElementById('sceneLabel').textContent = SCENE_NAMES[vibe] || vibe;
      const list = PACKS[currentPack].seeds[vibe];
      const query = list[seedIdx % list.length];
      seedIdx++;

      try {
        const res = await fetch('https://itunes.apple.com/search?term=' + encodeURIComponent(query) + '&media=music&entity=song&limit=1');
        const data = await res.json();
        const item = data.results && data.results[0];
        if (item) {
          document.getElementById('trackTitle').textContent = item.trackName;
          document.getElementById('trackArtist').textContent = item.artistName + ' · ' + (item.collectionName || '');
          document.getElementById('genreLabel').textContent = item.primaryGenreName || 'Music';
          document.getElementById('cover').src = item.artworkUrl100.replace('100x100bb', '600x600bb');
          if (item.previewUrl) {
            audio.src = item.previewUrl;
            if (isPlaying) audio.play().catch(()=>{});
          }
        }
      } catch (e) {}
    }

    document.getElementById('playBtn').onclick = () => {
      isPlaying = !isPlaying;
      document.getElementById('playBtn').textContent = isPlaying ? 'Пауза' : 'Запустить звук';
      if (isPlaying) audio.play().catch(()=>{}); else audio.pause();
    };
    document.getElementById('nextBtn').onclick = () => loadTrackForVibe(currentVibe);
    document.getElementById('autoBtn').onclick = () => {
      autoEnabled = !autoEnabled;
      document.getElementById('autoBtn').textContent = autoEnabled ? 'Авторежим активен' : 'Авторежим на паузе';
    };
    document.getElementById('simBtn').onclick = () => {
      const order = ['EXPLORE', 'STEALTH', 'COMBAT', 'BOSSFIGHT'];
      const next = order[(order.indexOf(currentVibe) + 1) % order.length];
      loadTrackForVibe(next);
    };
    audio.onended = () => loadTrackForVibe(currentVibe);

    let lastSwitch = 0;
    setInterval(async () => {
      if (!autoEnabled) return;
      try {
        const res = await fetch('/api/telemetry');
        const t = await res.json();
        document.getElementById('winTitle').textContent = t.detectedProcess || 'Windows';
        document.getElementById('motionVal').textContent = t.motionDelta + '%';
        document.getElementById('motionBar').style.width = t.motionDelta + '%';
        const now = Date.now();
        if (t.inferredVibe && t.inferredVibe !== currentVibe && now - lastSwitch > 10000) {
          lastSwitch = now;
          loadTrackForVibe(t.inferredVibe);
        }
      } catch (e) {}
    }, 1600);

    renderPacks();
    loadTrackForVibe('EXPLORE');
  </script>
</body>
</html>
