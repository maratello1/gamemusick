<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameVibe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0B0A0B;
      color: #ECE8E6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    header {
      border-bottom: 1px solid #221E20;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #8E8684;
    }
    main { max-width: 720px; width: 100%; margin: 40px auto; padding: 0 20px; display: flex; flex-direction: column; gap: 20px; }
    .card {
      background: #121113;
      border: 1px solid #221E20;
      border-radius: 6px;
      padding: 28px;
    }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .track-box { display: flex; align-items: center; gap: 20px; margin: 24px 0; flex-wrap: wrap; }
    .cover { width: 96px; height: 96px; border-radius: 4px; object-fit: cover; background: #1A181B; border: 1px solid #221E20; }
    h1 { font-size: 20px; font-weight: 600; color: #ECE8E6; margin: 4px 0; letter-spacing: -0.02em; }
    .sub { font-size: 13px; color: #8E8684; }
    .btn {
      padding: 9px 16px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid #221E20;
      background: #181619;
      color: #8E8684;
      cursor: pointer;
      transition: 0.15s;
    }
    .btn:hover { color: #ECE8E6; border-color: #6B1D2F; }
    .btn-wine {
      background: #6B1D2F;
      color: #ECE8E6;
      border: 1px solid #8E2940;
    }
    .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .pack {
      padding: 14px;
      border-radius: 4px;
      background: #121113;
      border: 1px solid #221E20;
      color: #8E8684;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
    }
    .pack.active {
      background: #1B1316;
      border-color: #6B1D2F;
      color: #ECE8E6;
    }
    .bar-bg { width: 100%; height: 4px; background: #221E20; border-radius: 2px; overflow: hidden; margin-top: 8px; }
    .bar-fill { height: 100%; background: #8E2940; width: 15%; transition: width 0.4s; }
  </style>
</head>
<body>
  <audio id="audio" crossorigin="anonymous"></audio>
  <header>
    <div><strong style="color:#ECE8E6; letter-spacing:0.12em;">GAMEVIBE</strong> &nbsp;·&nbsp; <span id="winTitle">Ожидание игры</span></div>
    <button class="btn" id="simBtn">Тест смены сцены</button>
  </header>
  <main>
    <div class="card">
      <div class="row" style="padding-bottom:18px; border-bottom:1px solid #221E20;">
        <div>
          <div style="font-size:11px; text-transform:uppercase; letter-spacing:0.12em; color:#8E8684;">Анализ экрана и управления</div>
          <div id="sceneLabel" style="font-size:18px; font-weight:600; color:#ECE8E6; margin-top:4px;">Спокойная сцена</div>
        </div>
        <button class="btn btn-wine" id="autoBtn">Автопилот: активен</button>
      </div>

      <div class="track-box">
        <img id="cover" class="cover" src="https://i.ytimg.com/vi/sTPn4Jlrjb0/hqdefault.jpg" alt="cover" />
        <div style="flex:1; min-width:180px;">
          <div id="genreLabel" style="font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:#B3475C;">Alternative</div>
          <h1 id="trackTitle">Entombed</h1>
          <div class="sub" id="trackArtist">Deftones</div>
        </div>
        <div style="min-width:210px; background:#0B0A0B; padding:14px; border-radius:4px; border:1px solid #221E20;">
          <div class="row" style="font-size:11px; color:#8E8684;">
            <span>Интенсивность в игре</span>
            <span id="motionVal" style="color:#ECE8E6;">14%</span>
          </div>
          <div class="bar-bg"><div class="bar-fill" id="motionBar"></div></div>
        </div>
      </div>

      <div class="row" style="padding-top:18px; border-top:1px solid #221E20;">
        <div class="row">
          <button class="btn btn-wine" id="playBtn">Включить звук</button>
          <button class="btn" id="nextBtn">Следующий трек</button>
        </div>
      </div>
    </div>

    <div class="grid4" id="packsGrid"></div>
  </main>

  <script>
    const PACKS = {
      mix: {
        label: 'Все лучшее',
        seeds: {
          EXPLORE: ['Deftones - Entombed', 'Kavinsky - Nightcall', 'Скриптонит - Положение', 'Кино - Спокойная ночь'],
          STEALTH: ['BONES - HDMI', 'Crystal Castles - Kerosene', 'DVRST - Close Eyes'],
          COMBAT: ['Travis Scott - FE!N', 'The Prodigy - Omen', 'Denzel Curry - ULTIMATE', 'Pendulum - Propane Nightmares'],
          BOSSFIGHT: ['Deftones - My Own Summer', 'Linkin Park - Faint', 'Rammstein - Sonne', 'Slipknot - Duality']
        }
      },
      rap: {
        label: 'Рэп и Фонк',
        seeds: {
          EXPLORE: ['Скриптонит - Положение', 'A$AP Rocky - Sundress', 'Miyagi - Silhouette'],
          STEALTH: ['BONES - HDMI', '$uicideboy$ - Paris', 'DVRST - Close Eyes'],
          COMBAT: ['Travis Scott - FE!N', 'Playboi Carti - Sky', 'Big Baby Tape kizaru - 99 Problems'],
          BOSSFIGHT: ['Playboi Carti - Stop Breathing', 'Denzel Curry - ULTIMATE', 'Ghostemane - Mercury']
        }
      },
      rock: {
        label: 'Рок и Метал',
        seeds: {
          EXPLORE: ['Deftones - Sextape', 'Кино - Спокойная ночь', 'Arctic Monkeys - 505'],
          STEALTH: ['Deftones - Change', 'Rammstein - Mein Herz Brennt', 'Король и Шут - Кукла колдуна'],
          COMBAT: ['Linkin Park - Faint', 'Nirvana - Smells Like Teen Spirit', 'Кино - Группа крови'],
          BOSSFIGHT: ['Deftones - My Own Summer', 'Rammstein - Sonne', 'Slipknot - Duality', 'System Of A Down - Chop Suey']
        }
      },
      electro: {
        label: 'Электроника',
        seeds: {
          EXPLORE: ['Kavinsky - Nightcall', 'M83 - Midnight City', 'Daft Punk - Veridis Quo'],
          STEALTH: ['Crystal Castles - Kerosene', 'Gesaffelstein - Aleph', 'Massive Attack - Angel'],
          COMBAT: ['The Prodigy - Omen', 'Pendulum - Propane Nightmares', 'Gesaffelstein - Pursuit'],
          BOSSFIGHT: ['The Prodigy - Breathe', 'Carpenter Brut - Turbo Killer', 'Pendulum - Watercolour']
        }
      }
    };

    const SCENE_NAMES = {
      EXPLORE: 'Спокойная сцена',
      STEALTH: 'Напряжение / Ночь',
      COMBAT: 'Экшен / Бой',
      BOSSFIGHT: 'Пик боя / Боссфайт'
    };

    let currentPack = 'mix';
    let currentVibe = 'EXPLORE';
    let autoEnabled = true;
    let isPlaying = false;
    let seedIdx = 0;
    const audio = document.getElementById('audio');

    function renderPacks() {
      const grid = document.getElementById('packsGrid');
      grid.innerHTML = '';
      Object.entries(PACKS).forEach(([id, p]) => {
        const btn = document.createElement('button');
        btn.className = 'pack ' + (id === currentPack ? 'active' : '');
        btn.textContent = p.label;
        btn.onclick = () => { currentPack = id; renderPacks(); loadTrackForVibe(currentVibe); };
        grid.appendChild(btn);
      });
    }

    async function loadTrackForVibe(vibe) {
      currentVibe = vibe;
      document.getElementById('sceneLabel').textContent = SCENE_NAMES[vibe] || vibe;
      const list = PACKS[currentPack].seeds[vibe];
      const query = list[seedIdx % list.length];
      seedIdx++;

      try {
        const res = await fetch('https://itunes.apple.com/search?term=' + encodeURIComponent(query) + '&media=music&entity=song&limit=1');
        const data = await res.json();
        const item = data.results && data.results[0];
        if (item) {
          document.getElementById('trackTitle').textContent = item.trackName;
          document.getElementById('trackArtist').textContent = item.artistName + ' · ' + (item.collectionName || '');
          document.getElementById('genreLabel').textContent = item.primaryGenreName || 'Music';
          document.getElementById('cover').src = item.artworkUrl100.replace('100x100bb', '600x600bb');
          if (item.previewUrl) {
            audio.src = item.previewUrl;
            if (isPlaying) audio.play().catch(()=>{});
          }
        }
      } catch (e) {}
    }

    document.getElementById('playBtn').onclick = () => {
      isPlaying = !isPlaying;
      document.getElementById('playBtn').textContent = isPlaying ? 'Пауза' : 'Включить звук';
      if (isPlaying) audio.play().catch(()=>{}); else audio.pause();
    };
    document.getElementById('nextBtn').onclick = () => loadTrackForVibe(currentVibe);
    document.getElementById('autoBtn').onclick = () => {
      autoEnabled = !autoEnabled;
      document.getElementById('autoBtn').textContent = autoEnabled ? 'Автопилот: активен' : 'Автопилот: пауза';
    };
    document.getElementById('simBtn').onclick = () => {
      const order = ['EXPLORE', 'STEALTH', 'COMBAT', 'BOSSFIGHT'];
      const next = order[(order.indexOf(currentVibe) + 1) % order.length];
      loadTrackForVibe(next);
    };
    audio.onended = () => loadTrackForVibe(currentVibe);

    let lastSwitch = 0;
    setInterval(async () => {
      if (!autoEnabled) return;
      try {
        const res = await fetch('/api/telemetry');
        const t = await res.json();
        document.getElementById('winTitle').textContent = t.detectedProcess || 'Windows';
        document.getElementById('motionVal').textContent = t.motionDelta + '%';
        document.getElementById('motionBar').style.width = t.motionDelta + '%';
        const now = Date.now();
        if (t.inferredVibe && t.inferredVibe !== currentVibe && now - lastSwitch > 10000) {
          lastSwitch = now;
          loadTrackForVibe(t.inferredVibe);
        }
      } catch (e) {}
    }, 1600);

    renderPacks();
    loadTrackForVibe('EXPLORE');
  </script>
</body>
</html>
