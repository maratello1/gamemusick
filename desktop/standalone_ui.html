<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameVibe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #080809;
      color: #EDE9E8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    .workspace { flex: 1; display: flex; gap: 8px; padding: 8px; min-height: 0; overflow: hidden; }
    aside { width: 260px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
    .panel { background: #111012; border: 1px solid #1E1B1D; border-radius: 8px; padding: 14px; }
    .lib-panel { flex: 1; display: flex; flex-direction: column; justify-content: space-between; overflow-y: auto; }
    main { flex: 1; background: #111012; border: 1px solid #1E1B1D; border-radius: 8px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
    header { padding: 12px 20px; border-bottom: 1px solid #1E1B1D; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .search-input {
      background: #1A181B; border: 1px solid #2A2629; color: #EDE9E8; border-radius: 99px;
      padding: 7px 14px; font-size: 12px; width: 340px; outline: none;
    }
    .hero {
      padding: 24px;
      background: linear-gradient(180deg, rgba(88, 22, 37, 0.55) 0%, rgba(32, 14, 19, 0.45) 65%, #111012 100%);
      border-bottom: 1px solid #1E1B1D;
      display: flex; align-items: flex-end; gap: 20px;
    }
    .hero-cover { width: 120px; height: 120px; border-radius: 6px; object-fit: cover; border: 1px solid rgba(255,255,255,0.1); }
    .scroll-area { flex: 1; overflow-y: auto; }
    .wave-item {
      display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px;
      cursor: pointer; border: 1px solid transparent; margin-top: 4px;
    }
    .wave-item.active { background: #1C1417; border-color: #4A1C28; }
    .wave-item img { width: 38px; height: 38px; border-radius: 4px; object-fit: cover; }
    .track-row {
      display: grid; grid-template-columns: 32px 1fr 160px 130px 56px; gap: 12px;
      align-items: center; padding: 8px 16px; border-bottom: 1px solid #181619; cursor: pointer; font-size: 13px;
    }
    .track-row:hover { background: #171518; }
    .track-row.active { background: #211217; color: #EA7B93; }
    .track-row img { width: 38px; height: 38px; border-radius: 4px; object-fit: cover; }
    footer {
      height: 82px; background: #0B0A0C; border-top: 1px solid #1E1B1D;
      padding: 0 22px; display: flex; align-items: center; justify-content: space-between;
    }
    .btn {
      padding: 7px 14px; border-radius: 6px; font-size: 12px; font-weight: 500;
      background: #1A181B; border: 1px solid #2A2629; color: #EDE9E8; cursor: pointer;
    }
    .btn-wine { background: #6E1D2F; border-color: #8E2940; color: #FFF; }
    .badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; background: #281419; color: #D47A8D; border: 1px solid #4A202B; display: inline-block; }
  </style>
</head>
<body>
  <audio id="audio" crossorigin="anonymous"></audio>
  <div class="workspace">
    <aside>
      <div class="panel">
        <div style="display:flex; justify-content:space-between; align-items:center; padding-bottom:10px; border-bottom:1px solid #1E1B1D;">
          <strong style="font-size:14px;">GameVibe</strong>
          <span id="winTitle" style="font-size:11px; color:#8C8482;">Windows</span>
        </div>
        <div style="margin-top:10px; font-size:12px; color:#EDE9E8;">Главная и Автопилот</div>
      </div>
      <div class="panel lib-panel">
        <div>
          <div style="font-size:11px; color:#8C8482; text-transform:uppercase; margin-bottom:8px;">Плейлисты Автопилота</div>
          <div id="wavesList"></div>
        </div>
        <div style="border-top:1px solid #1E1B1D; padding-top:12px;">
          <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:8px;">
            <span>Сенсор игры</span>
            <span id="sceneBadge" style="color:#D47A8D;">Спокойно</span>
          </div>
          <div style="font-size:11px; color:#8C8482; display:flex; justify-content:space-between;">
            <span>Активность</span><span id="motionVal">12%</span>
          </div>
          <div style="height:5px; background:#1E1B1D; border-radius:4px; margin-top:5px; overflow:hidden;">
            <div id="motionBar" style="height:100%; width:12%; background:#8E2940;"></div>
          </div>
        </div>
      </div>
    </aside>

    <main>
      <header>
        <input id="searchInput" class="search-input" placeholder="Найти любой трек или артиста (Enter)..." />
        <button class="btn" id="simBtn">Сменить сцену (Тест)</button>
      </header>
      <div class="scroll-area">
        <div class="hero">
          <img id="heroCover" class="hero-cover" src="https://i.ytimg.com/vi/sTPn4Jlrjb0/hqdefault.jpg" alt="cover" />
          <div>
            <div style="font-size:11px; color:#D47A8D; text-transform:uppercase; letter-spacing:0.08em;">АВТОПИЛОТ-ПЛЕЙЛИСТ</div>
            <h1 id="heroTitle" style="font-size:26px; margin:6px 0;">Все лучшее (Рок + Рэп + Электроника)</h1>
            <div id="heroSub" style="font-size:12px; color:#9E9694;">Deftones, Travis Scott, Linkin Park, Скриптонит, Rammstein, Кино</div>
          </div>
        </div>
        <div id="tracksTable"></div>
      </div>
    </main>
  </div>

  <footer>
    <div style="display:flex; align-items:center; gap:12px; width:30%;">
      <img id="playerCover" src="https://i.ytimg.com/vi/sTPn4Jlrjb0/hqdefault.jpg" style="width:52px; height:52px; border-radius:4px; object-fit:cover;" />
      <div>
        <div id="playerTitle" style="font-size:14px; font-weight:600;">Entombed</div>
        <div id="playerArtist" style="font-size:12px; color:#8C8482;">Deftones</div>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
      <button class="btn btn-wine" id="playBtn">▶ Воспроизвести</button>
    </div>
    <div style="width:30%; text-align:right; font-size:12px; color:#8C8482;">Автопилот активен</div>
  </footer>

  <script>
    const WAVES = {
      mix: { label: 'Все лучшее (Микс)', sub: 'Deftones, Travis Scott, Кино', query: 'Deftones Travis Scott Linkin Park' },
      rap: { label: 'Рэп, Трэп и Фонк', sub: 'Playboi Carti, Скриптонит, BONES', query: 'Travis Scott Playboi Carti Bones' },
      rock: { label: 'Рок и Метал', sub: 'Deftones, Rammstein, Slipknot', query: 'Deftones Linkin Park Rammstein' },
      electro: { label: 'Электроника', sub: 'The Prodigy, Kavinsky, Pendulum', query: 'The Prodigy Kavinsky Pendulum' }
    };
    const SCENES = ['Спокойно', 'Напряжение', 'Экшен / Бой', 'Пик боя'];
    let activeWave = 'mix';
    let tracks = [];
    let currentTrack = null;
    let isPlaying = false;
    const audio = document.getElementById('audio');

    function renderWaves() {
      const el = document.getElementById('wavesList');
      el.innerHTML = '';
      Object.entries(WAVES).forEach(([id, w]) => {
        const div = document.createElement('div');
        div.className = 'wave-item ' + (id === activeWave ? 'active' : '');
        div.innerHTML = '<div><div style="font-size:12px; font-weight:600;">' + w.label + '</div><div style="font-size:11px; color:#8C8482;">' + w.sub + '</div></div>';
        div.onclick = () => { activeWave = id; renderWaves(); loadTracks(w.query, w.label, w.sub); };
        el.appendChild(div);
      });
    }

    async function loadTracks(query, title, sub) {
      if (title) document.getElementById('heroTitle').textContent = title;
      if (sub) document.getElementById('heroSub').textContent = sub;
      try {
        const res = await fetch('https://itunes.apple.com/search?term=' + encodeURIComponent(query) + '&media=music&entity=song&limit=15');
        const data = await res.json();
        tracks = (data.results || []).map((item, i) => ({
          title: item.trackName,
          artist: item.artistName,
          album: item.collectionName || 'Single',
          cover: (item.artworkUrl100 || '').replace('100x100bb', '600x600bb'),
          preview: item.previewUrl,
          scene: SCENES[i % SCENES.length]
        }));
        renderTable();
        if (tracks[0] && !currentTrack) selectTrack(tracks[0], false);
      } catch (e) {}
    }

    function renderTable() {
      const container = document.getElementById('tracksTable');
      container.innerHTML = '';
      tracks.forEach((t, idx) => {
        const row = document.createElement('div');
        row.className = 'track-row ' + (currentTrack && currentTrack.title === t.title ? 'active' : '');
        row.innerHTML =
          '<span>' + (idx + 1) + '</span>' +
          '<div style="display:flex; align-items:center; gap:10px;"><img src="' + t.cover + '"/><div><div style="font-weight:500;">' + t.title + '</div><div style="font-size:11px; color:#8C8482;">' + t.artist + '</div></div></div>' +
          '<span style="font-size:12px; color:#8C8482; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">' + t.album + '</span>' +
          '<span><span class="badge">' + t.scene + '</span></span>' +
          '<span style="font-size:12px; color:#8C8482; text-align:right;">0:30</span>';
        row.onclick = () => selectTrack(t, true);
        container.appendChild(row);
      });
    }

    function selectTrack(t, playNow) {
      currentTrack = t;
      document.getElementById('playerTitle').textContent = t.title;
      document.getElementById('playerArtist').textContent = t.artist;
      document.getElementById('playerCover').src = t.cover;
      document.getElementById('heroCover').src = t.cover;
      if (t.preview) {
        audio.src = t.preview;
        if (playNow) { isPlaying = true; audio.play().catch(()=>{}); }
      }
      document.getElementById('playBtn').textContent = isPlaying ? '❚❚ Пауза' : '▶ Воспроизвести';
      renderTable();
    }

    document.getElementById('playBtn').onclick = () => {
      isPlaying = !isPlaying;
      if (isPlaying) audio.play().catch(()=>{}); else audio.pause();
      document.getElementById('playBtn').textContent = isPlaying ? '❚❚ Пауза' : '▶ Воспроизвести';
    };

    document.getElementById('searchInput').onkeydown = (e) => {
      if (e.key === 'Enter' && e.target.value.trim()) {
        loadTracks(e.target.value.trim(), 'Поиск: ' + e.target.value.trim(), 'Результаты поиска');
      }
    };

    document.getElementById('simBtn').onclick = () => {
      if (tracks.length > 0) {
        const next = tracks[Math.floor(Math.random() * tracks.length)];
        document.getElementById('sceneBadge').textContent = next.scene;
        selectTrack(next, true);
      }
    };

    renderWaves();
    loadTracks(WAVES.mix.query, WAVES.mix.label, WAVES.mix.sub);
  </script>
</body>
</html>
