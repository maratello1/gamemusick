<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 140" width="640" height="140">
  <defs>
    <!-- Crimson Neon Wave Gradient -->
    <linearGradient id="waveGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D6D" />
      <stop offset="50%" stop-color="#C9184A" />
      <stop offset="100%" stop-color="#6E1D2F" />
    </linearGradient>

    <!-- Emerald Calm Gradient -->
    <linearGradient id="emeraldGradH" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <filter id="glowH" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Crest (110x110) -->
  <g transform="translate(15, 15)">
    <!-- Squircle Tile -->
    <rect x="0" y="0" width="110" height="110" rx="26" fill="#120E11" stroke="#331A24" stroke-width="2.5" />
    
    <!-- Soundwave equalizer bars inside tile -->
    <rect x="18" y="45" width="4" height="20" rx="2" fill="#6E1D2F" />
    <rect x="25" y="35" width="4" height="40" rx="2" fill="#8C2038" />
    <rect x="32" y="28" width="4" height="54" rx="2" fill="#C9184A" />

    <!-- "GV" Monogram -->
    <path d="M 58 34 L 46 41 L 46 71 L 58 78 L 68 72 L 68 62 L 56 62 L 56 55 L 75 55 L 75 75 L 58 84 L 38 73 L 38 36 L 58 26 Z"
          fill="url(#waveGradH)" />
    <path d="M 64 36 L 76 60 L 88 36 L 96 41 L 79 73 L 73 73 L 56 41 Z"
          fill="url(#waveGradH)" opacity="0.95" />

    <!-- Core Dot -->
    <circle cx="61" cy="55" r="4.5" fill="url(#emeraldGradH)" />
    <circle cx="61" cy="55" r="1.5" fill="#FFFFFF" />

    <!-- Right mini bars -->
    <rect x="86" y="42" width="4" height="26" rx="2" fill="#C9184A" />
    <rect x="93" y="48" width="4" height="14" rx="2" fill="#8C2038" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(145, 30)">
    <!-- Main Wordmark -->
    <text x="0" y="46" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" letter-spacing="1.5" fill="#EDE9E8">
      GAME<tspan fill="url(#waveGradH)">VIBE</tspan>
    </text>

    <!-- Subtitle & Pill Badge -->
    <text x="2" y="74" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" letter-spacing="3" fill="#8C8482">
      AI SOUND DIRECTOR &amp; ADAPTIVE OST
    </text>

    <!-- Mini Green Status Pill -->
    <rect x="365" y="24" width="76" height="22" rx="11" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="376" cy="35" r="3" fill="#10B981" />
    <text x="384" y="39" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10" fill="#6EE7B7" letter-spacing="0.5">
      FREE v2.0
    </text>
  </g>
</svg>
