<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1B0E14" />
      <stop offset="60%" stop-color="#0E0B0D" />
      <stop offset="100%" stop-color="#070607" />
    </radialGradient>

    <!-- Crimson Neon Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D6D" />
      <stop offset="50%" stop-color="#C9184A" />
      <stop offset="100%" stop-color="#6E1D2F" />
    </linearGradient>

    <!-- Emerald Calm Accent Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Cyber Shield Outer Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Tile with Squircle Border -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#2D1720" stroke-width="6" />
  
  <!-- Subtle Ambient Glow Ring -->
  <circle cx="256" cy="240" r="170" fill="none" stroke="#FF4D6D" stroke-width="1.5" opacity="0.15" />
  <circle cx="256" cy="240" r="140" fill="none" stroke="#6E1D2F" stroke-width="1" stroke-dasharray="6 6" opacity="0.3" />

  <!-- Outer Soundwave Pulse Bars (Left & Right Wings) -->
  <g opacity="0.85">
    <!-- Left Equalizer Wing -->
    <rect x="76" y="210" width="10" height="60" rx="5" fill="#6E1D2F" />
    <rect x="98" y="180" width="10" height="120" rx="5" fill="#8C2038" />
    <rect x="120" y="150" width="10" height="180" rx="5" fill="#A82844" />
    <rect x="142" y="195" width="10" height="90" rx="5" fill="#C9184A" />

    <!-- Right Equalizer Wing -->
    <rect x="360" y="195" width="10" height="90" rx="5" fill="#C9184A" />
    <rect x="382" y="150" width="10" height="180" rx="5" fill="#A82844" />
    <rect x="404" y="180" width="10" height="120" rx="5" fill="#8C2038" />
    <rect x="426" y="210" width="10" height="60" rx="5" fill="#6E1D2F" />
  </g>

  <!-- Central "GV" Gaming Vibe Monogram Crest -->
  <g filter="url(#glow)">
    <!-- "G" Hex-Bevel Path -->
    <path d="M 230 130 
             L 185 155 
             L 185 305 
             L 245 340 
             L 285 315 
             L 285 270 
             L 240 270 
             L 240 240 
             L 315 240 
             L 315 330 
             L 245 372 
             L 155 322 
             L 155 138 
             L 230 96 Z"
          fill="url(#waveGrad)" />

    <!-- "V" Kinetic Dynamic Arrow Crest -->
    <path d="M 270 140 
             L 325 245 
             L 380 140 
             L 415 160 
             L 338 310 
             L 312 310 
             L 235 160 Z"
          fill="url(#waveGrad)"
          opacity="0.95" />
  </g>

  <!-- Center Energy Core: Emerald Radar Dot (Sense & Play) -->
  <circle cx="256" cy="240" r="14" fill="url(#emeraldGrad)" filter="url(#innerGlow)" />
  <circle cx="256" cy="240" r="5" fill="#FFFFFF" />

  <!-- Bottom Accent Tagline / Dot Matrix -->
  <g opacity="0.6">
    <circle cx="216" cy="420" r="4" fill="#FF4D6D" />
    <circle cx="236" cy="420" r="4" fill="#FF4D6D" />
    <circle cx="256" cy="420" r="5" fill="#10B981" />
    <circle cx="276" cy="420" r="4" fill="#FF4D6D" />
    <circle cx="296" cy="420" r="4" fill="#FF4D6D" />
  </g>
</svg>
