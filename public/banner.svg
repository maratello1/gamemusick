<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <radialGradient id="bannerBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#220D16" />
      <stop offset="50%" stop-color="#0E0B0E" />
      <stop offset="100%" stop-color="#050506" />
    </radialGradient>

    <linearGradient id="waveB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D6D" />
      <stop offset="50%" stop-color="#C9184A" />
      <stop offset="100%" stop-color="#6E1D2F" />
    </linearGradient>

    <linearGradient id="glowG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="bigGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Background with Subtle Grid Pattern -->
  <rect x="0" y="0" width="1280" height="640" fill="url(#bannerBg)" />

  <!-- Grid Lines -->
  <g stroke="#1F171D" stroke-width="1" opacity="0.3">
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="0" y1="480" x2="1280" y2="480" />
    <line x1="320" y1="0" x2="320" y2="640" />
    <line x1="640" y1="0" x2="640" y2="640" />
    <line x1="960" y1="0" x2="960" y2="640" />
  </g>

  <!-- Decorative Ambient Soundwave Lines in Background -->
  <path d="M 0 320 Q 320 200 640 320 T 1280 320" fill="none" stroke="#FF4D6D" stroke-width="2" opacity="0.15" />
  <path d="M 0 320 Q 320 440 640 320 T 1280 320" fill="none" stroke="#6E1D2F" stroke-width="3" opacity="0.25" />

  <!-- Center Content Container -->
  <g transform="translate(640, 290)">
    <!-- Main Crest Icon (Scale 0.75 centered) -->
    <g transform="translate(-65, -210) scale(0.65)" filter="url(#bigGlow)">
      <rect x="0" y="0" width="200" height="200" rx="46" fill="#150E13" stroke="#3D1A27" stroke-width="4" />
      <path d="M 100 48 L 74 62 L 74 136 L 100 152 L 122 138 L 122 118 L 102 118 L 102 104 L 138 104 L 138 144 L 100 166 L 56 142 L 56 56 L 100 32 Z" fill="url(#waveB)" />
      <path d="M 112 52 L 136 106 L 160 52 L 176 62 L 142 134 L 130 134 L 98 62 Z" fill="url(#waveB)" opacity="0.95" />
      <circle cx="106" cy="104" r="8" fill="url(#glowG)" />
      <circle cx="106" cy="104" r="3" fill="#FFFFFF" />
    </g>

    <!-- Main Title -->
    <text x="0" y="-10" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="76" letter-spacing="2" fill="#EDE9E8">
      GAME<tspan fill="url(#waveB)">VIBE</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="44" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="22" letter-spacing="4" fill="#A89FA2">
      AI-DJ &amp; ADAPTIVE SOUNDTRACK PLATFORM
    </text>

    <!-- Punchy Description -->
    <text x="0" y="86" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="16" fill="#756D71">
      Automatic music transitions for exploration, combat, boss fights &amp; drama — 100% Free &amp; Anti-Cheat Safe
    </text>

    <!-- 4 Feature Badges -->
    <g transform="translate(0, 140)">
      <!-- Badge 1: Zero Cloud Fees -->
      <g transform="translate(-360, 0)">
        <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#161216" stroke="#2B2129" stroke-width="1.5" />
        <circle cx="-75" cy="0" r="4" fill="#10B981" />
        <text x="-62" y="5" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#EDE9E8">100% Free · No API Key</text>
      </g>

      <!-- Badge 2: Scene-Based Playlists -->
      <g transform="translate(-115, 0)">
        <rect x="-105" y="-18" width="210" height="36" rx="18" fill="#161216" stroke="#2B2129" stroke-width="1.5" />
        <circle cx="-85" cy="0" r="4" fill="#FF4D6D" />
        <text x="-72" y="5" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#EDE9E8">Scene-Based Playlists</text>
      </g>

      <!-- Badge 3: Optical + Vision AI -->
      <g transform="translate(130, 0)">
        <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#161216" stroke="#2B2129" stroke-width="1.5" />
        <circle cx="-75" cy="0" r="4" fill="#8B5CF6" />
        <text x="-62" y="5" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#EDE9E8">Vision AI + Win32 OCR</text>
      </g>

      <!-- Badge 4: Full YouTube Streaming -->
      <g transform="translate(360, 0)">
        <rect x="-90" y="-18" width="180" height="36" rx="18" fill="#161216" stroke="#2B2129" stroke-width="1.5" />
        <circle cx="-70" cy="0" r="4" fill="#FF0000" />
        <text x="-58" y="5" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#EDE9E8">Full YouTube Stream</text>
      </g>
    </g>
  </g>
</svg>
